<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Annakut Family Path — Swaminarayan Hariprabodham Parivar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #080B14;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Shruti", "Gujarati Sangam MN", sans-serif;
        }
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Game Engine Scripts (Strict Dependency Order) -->
    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/input.js"></script>
    <script src="js/obstacles.js"></script>
    <script src="js/demon.js"></script>
    <script src="js/background.js"></script>
    <script src="js/player.js"></script>
    <script src="js/choices.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
